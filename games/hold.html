<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>架枪训练</title>
<!-- 像素风 CS 第一人称架枪：Dust2 A 大道，准星固定在屏幕中心，动鼠标转视角。
     每回合先把准星对准白圈稳住，随机等待后敌人从远处门缝 / 中距离箱子 / 近处石柱探头；
     敌人露头后在「敌人反应时间」内没打死他，他就打死你，游戏结束。反应时间从 650ms 起，每杀一个快 25ms，最快 300ms。
     开枪太早会暴露位置，敌人立刻预瞄着拉出来。连续开枪会散布变大，弹匣打空要换弹。底层工具在 pixelkit.js。 -->
<style>
  * { margin:0; padding:0; }
  html, body { height:100%; background:#1a1c2c; overflow:hidden; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; cursor:none; touch-action:none; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="pixelkit.js"></script>
<script>
(() => {
  const { C, RM, B4, store, json, btext, btextW, ctext, icon, ring, panel, button, inRect, audio } = PK
  const KEY_BEST = 'hold-angle-best-v1'
  const SLOW = /[?&]slow/.test(location.search)          // 调试：地址带 ?slow 时敌人反应时间 ×10
  const DEBUG = SLOW || /[?&]debug/.test(location.search) // 调试：?slow 或 ?debug 时暴露 window.__hold()
  const SLIDE = 90                                         // 敌人探出用时（毫秒），分 3 步
  const ttkFor = kills => Math.max(300, 650 - kills * 25) * (SLOW ? 10 : 1)   // 敌人反应时间：露头后多久打死你
  const ZONE = 3                                           // 架点判定半径（美术像素）
  const RELOAD = 2000
  const RANKS = [
    [16, '全球精英', 'GLOBAL ELITE'], [12, '传奇之鹰', 'LEGENDARY EAGLE'],
    [8, '守护精英', 'MASTER GUARDIAN'], [4, '黄金新星', 'GOLD NOVA'], [0, '白银', 'SILVER'],
  ]
  const rankOf = kills => RANKS.find(r => kills >= r[0])
  const rand = (a, b) => a + Math.random() * (b - a)
  const R = Math.round

  const S = PK.screen(document.getElementById('cv'))
  const g = S.g
  const cam = { x: 0, y: 0 }   // 世界坐标里，屏幕中心（准星）对着的点
  const P = PK.pointer(S, { onDelta: (dx, dy) => { if (state === 'play' || state === 'dying') { cam.x += dx; cam.y += dy; clampCam() } } })

  // ---------- 像素多边形：逐行求交填充，col 可以是颜色或 (x,y)=>颜色 ----------
  function fillPoly(ctx, pts, col) {
    let y0 = Infinity, y1 = -Infinity
    for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]) }
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
      const yc = y + 0.5, xs = []
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, yi] = pts[i], [xj, yj] = pts[j]
        if ((yi > yc) !== (yj > yc)) xs.push(xi + (yc - yi) * (xj - xi) / (yj - yi))
      }
      xs.sort((a, b) => a - b)
      for (let k = 0; k + 1 < xs.length; k += 2) {
        const a = R(xs[k]), b = R(xs[k + 1])
        if (b <= a) continue
        if (typeof col === 'string') { ctx.fillStyle = col; ctx.fillRect(a, y, b - a, 1) }
        else for (let x = a; x < b; x++) { ctx.fillStyle = col(x, y); ctx.fillRect(x, y, 1, 1) }
      }
    }
  }
  const dith = (x, y, k) => B4[y & 3][x & 3] / 16 < k        // Bayer 抖动：k∈[0,1] 是这一点取第二种颜色的比例

  // ---------- 世界布局（单位：美术像素；世界是屏幕的 2×2，镜头在里面平移） ----------
  let W, H, WW, WH, WC, hy, gy, far, door, leafW, gap, crate, pillar, floorMid, floorNear, sideW, crateSide, EH
  const layers = {}
  let VM = null, vmS = 1, vmGeo = null

  function layout() {
    S.resize()
    W = S.W; H = S.H
    WW = W * 2; WH = H * 2
    WC = { x: R(WW / 2), y: R(WH / 2) }
    hy = WC.y - R(H * 0.03)                       // 地平线（视线高度）
    gy = hy + R(H * 0.04)                         // 远墙墙根
    const fw = R(W * 0.62), fh = R(H * 0.2)
    far = { x: WC.x - R(fw / 2), y: gy - fh, w: fw, h: fh, r: WC.x - R(fw / 2) + fw }
    const dw = R(fw * 0.46), dh = R(fh * 0.82)
    door = { x: WC.x - R(dw / 2) + R(W * 0.02), y: gy - dh, w: dw, h: dh }
    door.r = door.x + dw
    leafW = R(dw * 0.52)
    gap = { x: door.x + leafW, y: door.y, w: R(dw * 0.3), h: dh }
    gap.r = gap.x + gap.w
    floorMid = gy + R(H * 0.13)
    floorNear = gy + R(H * 0.27)
    crate = { x: WC.x + R(W * 0.17), w: R(W * 0.3), h: R(H * 0.25) }
    crate.y = floorMid - crate.h; crate.r = crate.x + crate.w
    pillar = { x: WC.x - R(W * 0.78), r: WC.x - R(W * 0.34) }
    sideW = Math.max(4, R(W * 0.05)); crateSide = Math.max(2, R(W * 0.022))
    EH = { door: R(H * 0.115), crate: R(H * 0.2), pillar: R(H * 0.3) }
    bake()
    bakeViewmodel()
    if (!cam.x) { cam.x = WC.x; cam.y = WC.y }
    clampCam()
  }
  function clampCam() {
    cam.x = Math.max(W / 2, Math.min(WW - W / 2, cam.x))
    cam.y = Math.max(H / 2, Math.min(WH - H / 2, cam.y))
  }

  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c }

  function bake() {
    let seed = 11
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
    const nearTop = far.y - R(H * 0.42), nearBot = gy + R(H * 0.6)

    // L0：天空、两侧墙、地面、远墙和门洞里的暗处
    const L0 = canvas(WW, WH), a = L0.getContext('2d')
    a.fillStyle = C.sky; a.fillRect(0, 0, WW, WH)
    for (let y = far.y - R(H * 0.12); y < gy; y++) for (let x = 0; x < WW; x++) {
      const k = (y - (far.y - R(H * 0.12))) / (H * 0.12)
      a.fillStyle = dith(x, y, k * 0.9) ? C.cyan : C.sky
      a.fillRect(x, y, 1, 1)
    }
    // 几朵云
    for (const [cx, cy, w] of [[WC.x - W * 0.45, far.y - H * 0.3, 22], [WC.x + W * 0.25, far.y - H * 0.42, 30], [WC.x + W * 0.6, far.y - H * 0.18, 16]]) {
      a.fillStyle = C.white
      a.fillRect(R(cx), R(cy), w, 2); a.fillRect(R(cx + w * 0.2), R(cy - 2), R(w * 0.45), 2)
      a.fillStyle = C.cyan; a.fillRect(R(cx - 3), R(cy + 2), w + 6, 1)
    }
    // 地面：沙色，透视方向的地砖缝 + 越近越粗的颗粒
    const vpx = WC.x
    fillPoly(a, [[0, nearBot], [far.x, gy], [far.r, gy], [WW, nearBot], [WW, WH], [0, WH]], (x, y) => {
      const d = y - hy
      for (const lane of [-0.9, 0.9]) {                                                   // 两道车辙，汇向灭点
        const lx = vpx + lane * d * 0.9
        if (Math.abs(x - lx) < 0.6 + d * 0.012) return dith(x, y, 0.5) ? C.orange : C.gold
      }
      return dith(x, y, 0.04 + Math.min(0.18, (y - gy) / H * 0.3)) ? C.orange : C.gold
    })
    // 两侧墙：横向砖缝按透视汇聚；左墙朝右受光，右墙背光
    const sideWall = (left) => {
      const x0 = left ? 0 : WW, x1 = left ? far.x : far.r
      fillPoly(a, [[x0, nearTop], [x1, far.y], [x1, gy], [x0, nearBot]], (x, y) => {
        const t = (x - x0) / (x1 - x0)
        const top = nearTop + (far.y - nearTop) * t, bot = nearBot + (gy - nearBot) * t
        const v = (y - top) / (bot - top), v2 = (y + 1 - top) / (bot - top)
        if (v < 0.012) return C.white                                                     // 墙顶石沿
        if (v < 0.03) return C.orange
        const rows = 9
        if (Math.floor(v * rows) !== Math.floor(v2 * rows)) return C.orange               // 砖缝（横）
        const z = 1 / (1.08 - t), z2 = 1 / (1.08 - (x + (left ? 1 : -1) - x0) / (x1 - x0))
        const shift = (Math.floor(v * rows) & 1) * 0.5
        if (Math.floor(z * 2 + shift) !== Math.floor(z2 * 2 + shift)) return C.orange     // 砖缝（竖，越远越密）
        if (bot - y < 3 + 6 * (1 - t)) return dith(x, y, 0.6) ? C.red : C.orange          // 墙根阴影
        return left ? (dith(x, y, 0.04) ? C.orange : C.gold) : (dith(x, y, 0.4) ? C.orange : C.gold)
      })
    }
    sideWall(true); sideWall(false)
    // 远墙
    for (let y = far.y; y < gy; y++) for (let x = far.x; x < far.r; x++) {
      const row = Math.floor((y - far.y - 2) / 4)
      let col = dith(x, y, 0.06) ? C.orange : C.gold
      if (y - far.y < 1) col = C.white
      else if (y - far.y < 2) col = C.orange
      else if ((y - far.y - 2) % 4 === 3) col = C.orange
      else if ((x - far.x + (row & 1) * 4) % 8 === 0) col = C.orange
      else if (gy - y <= 2) col = C.red
      a.fillStyle = col; a.fillRect(x, y, 1, 1)
    }
    // 门洞里：暗处，顶上漏一点光
    for (let y = door.y; y < gy; y++) for (let x = door.x; x < door.r; x++) {
      const k = 1 - (y - door.y) / (door.h * 0.5)
      a.fillStyle = k > 0 && dith(x, y, k * 0.7) ? C.navy : (gy - y <= 2 ? C.dusk : C.ink)
      a.fillRect(x, y, 1, 1)
    }
    layers.bg = L0

    // L1：A 大门的两扇蓝色木门 + 门框
    const L1 = canvas(WW, WH), b = L1.getContext('2d')
    const leaf = (x0, w, dark) => {
      for (let y = door.y; y < gy; y++) for (let x = x0; x < x0 + w; x++) {
        const fy = (y - door.y) / door.h
        let col = (x - x0) % 3 === 2 ? (dark ? C.ink : C.navy) : (dark ? C.navy : C.blue)        // 竖木板
        if (Math.abs(fy - 0.22) < 0.035 || Math.abs(fy - 0.72) < 0.035) col = (x - x0) % 4 === 1 ? C.fog : C.dusk   // 铁箍 + 铆钉
        if (!dark && x === x0) col = C.sky
        if (y >= gy - 1) col = C.ink
        b.fillStyle = col; b.fillRect(x, y, 1, 1)
      }
    }
    leaf(door.x, leafW, false)
    leaf(gap.r, door.r - gap.r, true)
    b.fillStyle = C.fog; b.fillRect(door.x - 2, door.y - 3, door.w + 4, 3)
    b.fillStyle = C.white; b.fillRect(door.x - 2, door.y - 3, door.w + 4, 1)
    b.fillStyle = C.fog; b.fillRect(door.x - 2, door.y, 2, gy - door.y); b.fillRect(door.r, door.y, 2, gy - door.y)
    layers.door = L1

    // L2：两只叠起来的木箱（在灭点右边，能看到左侧面）
    const L2 = canvas(WW, WH), c2 = L2.getContext('2d')
    fillPoly(c2, [[crate.x - crateSide - 2, floorMid - 1], [crate.x, floorMid], [crate.x, floorMid + 3], [crate.x - crateSide - 6, floorMid + 2]], (x, y) => dith(x, y, 0.5) ? C.red : C.orange)   // 影子
    fillPoly(c2, [[crate.x - crateSide, crate.y + 1], [crate.x, crate.y], [crate.x, floorMid], [crate.x - crateSide, floorMid - 1]], (x, y) => (y - crate.y) % 5 === 0 ? C.plum : C.red)
    const box = (x, y, w, h) => {
      c2.fillStyle = C.red; c2.fillRect(x, y, w, h)
      c2.fillStyle = C.orange; c2.fillRect(x + 2, y + 2, w - 4, h - 4)
      c2.fillStyle = C.gold; c2.fillRect(x + 1, y + 1, w - 2, 1)
      c2.fillStyle = C.red
      for (let yy = y + 6; yy < y + h - 2; yy += 5) c2.fillRect(x + 2, yy, w - 4, 1)
      for (let i = 0; i < w - 6; i++) {
        const yy = y + 2 + R(i * (h - 5) / (w - 6))
        c2.fillStyle = C.plum; c2.fillRect(x + 3 + i, yy, 1, 1)
        c2.fillStyle = C.red; c2.fillRect(x + 3 + i, yy + 1, 1, 1)
      }
    }
    const half = R(crate.h / 2)
    box(crate.x, crate.y + half, crate.w, crate.h - half)
    box(crate.x + 2, crate.y, crate.w - 4, half + 1)
    layers.crate = L2

    // L3：近处石柱（在灭点左边，能看到被太阳照亮的右侧面）
    const L3 = canvas(WW, WH), d3 = L3.getContext('2d')
    fillPoly(d3, [[pillar.x, floorNear], [pillar.r + sideW + 4, floorNear - 2], [pillar.r + sideW + 10, floorNear + 3], [pillar.x, floorNear + 5]], (x, y) => dith(x, y, 0.45) ? C.red : C.orange)
    for (let y = 0; y < floorNear; y++) for (let x = pillar.x; x < pillar.r; x++) {
      const row = Math.floor(y / 9)
      let col = dith(x, y, 0.35) ? C.orange : C.gold
      if (y % 9 === 8) col = C.red
      else if ((x - pillar.x + (row & 1) * 9) % 18 === 0) col = C.red
      else if (floorNear - y < 5) col = dith(x, y, 0.5) ? C.red : C.orange
      d3.fillStyle = col; d3.fillRect(x, y, 1, 1)
    }
    fillPoly(d3, [[pillar.r, 0], [pillar.r + sideW, 0], [pillar.r + sideW, floorNear - 2], [pillar.r, floorNear]], (x, y) => {
      if (x === pillar.r) return C.white
      return y % 9 === 8 ? C.orange : (dith(x, y, 0.1) ? C.white : C.gold)
    })
    layers.pillar = L3
  }

  // ---------- 第一人称持枪（AK-47 + 手套袖子），按屏幕宽度缩放后预渲染 ----------
  function bakeViewmodel() {
    vmS = Math.min(W / 134, H / 250) * 1.3
    const BW = 92, BH = 78
    const c = canvas(Math.ceil(BW * vmS), Math.ceil(BH * vmS)), x2 = c.getContext('2d')
    const M = [10, 14], Rr = [100, 58]
    const L = Math.hypot(Rr[0] - M[0], Rr[1] - M[1])
    const d = [(Rr[0] - M[0]) / L, (Rr[1] - M[1]) / L], n = [-d[1], d[0]]   // d 指向枪托，n 指向下方
    const Pt = (t, o) => [(M[0] + d[0] * L * t + n[0] * o) * vmS, (M[1] + d[1] * L * t + n[1] * o) * vmS]
    const quad = (t0, t1, c0, h0, h1, col) => fillPoly(x2, [Pt(t0, c0 - h0), Pt(t1, c0 - h1), Pt(t1, c0 + h1), Pt(t0, c0 + h0)], col)
    const edge = (t0, t1, o0, o1, col) => {
      const steps = Math.ceil(L * (t1 - t0) * vmS)
      x2.fillStyle = col
      for (let i = 0; i <= steps; i++) { const t = t0 + (t1 - t0) * i / steps, p = Pt(t, o0 + (o1 - o0) * i / steps); x2.fillRect(R(p[0]), R(p[1]), 1, 1) }
    }
    const L_ = (x, y) => [x * vmS, y * vmS]

    // 左臂（袖子 + 手套），先画在枪下面
    const arm = (a0, a1, b0, b1) => {
      fillPoly(x2, [a0, a1, b1, b0], C.navy)
      const steps = 40
      x2.fillStyle = C.blue
      for (let i = 0; i <= steps; i++) { const k = i / steps; x2.fillRect(R(a1[0] + (b1[0] - a1[0]) * k) - 1, R(a1[1] + (b1[1] - a1[1]) * k), 1, 1) }
    }
    arm(Pt(0.36, 5.2), Pt(0.48, 5.8), L_(22, 92), L_(38, 92))
    fillPoly(x2, [Pt(0.355, 4.8), Pt(0.485, 5.4), Pt(0.48, 8.2), Pt(0.35, 7.6)], C.dusk)   // 袖口
    // 枪管、准星座、导气管
    quad(0, 0.3, 0, 0.9, 1.1, C.dusk); edge(0, 0.3, -0.9, -1.1, C.slate)
    fillPoly(x2, [Pt(0.035, -0.8), Pt(0.065, -0.8), Pt(0.065, -4), Pt(0.035, -4)], C.ink)
    quad(0.16, 0.4, -2.4, 0.9, 1.1, C.dusk); edge(0.16, 0.4, -3.3, -3.5, C.slate)
    // 木护木（上下两段）
    quad(0.27, 0.52, 0.7, 2.6, 3.6, C.red); edge(0.27, 0.52, -1.9, -2.9, C.orange); edge(0.27, 0.52, 3.3, 4.3, C.plum)
    edge(0.3, 0.5, 0.2, 0.4, C.plum); edge(0.3, 0.5, 1.4, 1.8, C.plum)
    quad(0.3, 0.44, -2.7, 1.2, 1.5, C.red); edge(0.3, 0.44, -3.9, -4.2, C.orange)
    // 机匣、表尺、防尘盖棱
    quad(0.5, 1.06, -0.3, 3.8, 6.5, C.dusk); edge(0.5, 1.06, -4.1, -6.8, C.slate); edge(0.5, 1.06, 3.5, 6.2, C.ink)
    fillPoly(x2, [Pt(0.5, -4.1), Pt(0.57, -4.4), Pt(0.57, -6.4), Pt(0.5, -5.8)], C.ink)
    for (const t of [0.86, 0.9, 0.94, 0.98]) edge(t, t + 0.005, -4.5, -1.5, C.ink)
    // 弯弹匣
    const A = Pt(0.56, 3.6), B = Pt(0.68, 4.4)
    const Bm = [B[0] + (n[0] * 8 - d[0] * 2) * vmS, B[1] + (n[1] * 8 - d[1] * 2) * vmS], Bz = [B[0] + (n[0] * 16 - d[0] * 7) * vmS, B[1] + (n[1] * 16 - d[1] * 7) * vmS]
    const Am = [A[0] + (n[0] * 8 - d[0] * 4) * vmS, A[1] + (n[1] * 8 - d[1] * 4) * vmS], Az = [A[0] + (n[0] * 15 - d[0] * 10) * vmS, A[1] + (n[1] * 15 - d[1] * 10) * vmS]
    fillPoly(x2, [A, B, Bm, Bz, Az, Am], (x, y) => dith(x, y, 0.12) ? C.dusk : C.ink)
    x2.fillStyle = C.dusk
    for (let i = 0; i <= 10; i++) { const k = i / 10, p = [A[0] + (Am[0] - A[0]) * k * 2, A[1] + (Am[1] - A[1]) * k * 2]; if (k <= 0.5) x2.fillRect(R(p[0]), R(p[1]), 1, 1) }
    // 左手手套握住护木，手指搭在上面
    fillPoly(x2, [Pt(0.35, 1.2), Pt(0.49, 1.8), Pt(0.5, 6.2), Pt(0.34, 5.6)], C.ink)
    for (const t of [0.37, 0.41, 0.45]) fillPoly(x2, [Pt(t, -2.2), Pt(t + 0.03, -2.4), Pt(t + 0.03, 1.4), Pt(t, 1.4)], C.dusk)
    edge(0.35, 0.49, 5.6, 6.2, C.dusk)
    // 右手握把 + 袖子
    arm(Pt(0.83, 9.5), Pt(0.96, 10.5), L_(82, 92), L_(100, 92))
    fillPoly(x2, [Pt(0.82, 4.8), Pt(0.96, 5.8), Pt(0.95, 11), Pt(0.8, 10)], C.ink)
    edge(0.82, 0.95, 10, 11, C.dusk)

    VM = c
    vmGeo = { BW, BH, muzzle: Pt(-0.02, 0), port: Pt(0.74, -4.5), d }
  }

  // ---------- 敌人：「匪徒」模板（身高 40 个单位的多边形，脚底中心为原点、面朝右），按身高缩放后逐像素填充 ----------
  // 每项 [颜色, 点列]；part 用来标记命中区域和姿势变形
  const TPL = [
    ['dusk', [[-3.2, -16], [0.2, -16], [0.4, -2], [-2.6, -2]], 'leg'],                       // 后腿
    ['ink', [[-3, -2], [0.6, -2], [1.2, 0], [-3, 0]], 'leg'],
    ['navy', [[-0.2, -16], [3.4, -16], [3, -9], [3.6, -2], [0.6, -2], [0.4, -9]], 'leg'],     // 前腿
    ['slate', [[0.3, -10.2], [3.4, -10.2], [3.4, -8.2], [0.3, -8.2]], 'leg'],                // 护膝
    ['ink', [[0.4, -2], [4.6, -2], [4.8, 0], [0.4, 0]], 'leg'],                              // 靴子
    ['teal', [[-2.6, -29], [-0.6, -29.6], [3.2, -25.6], [9, -25], [9, -23.4], [2.4, -23.8]], 'arm'],   // 后臂伸向护木
    ['green', [[-4.6, -30.4], [4, -30.4], [3.6, -16], [-3.8, -16]], 'body'],                  // 夹克
    ['teal', [[-4.6, -30.4], [-2.4, -30.4], [-2, -16], [-3.8, -16]], 'body'],                 // 背光一侧
    ['dusk', [[-3.4, -28.6], [3.4, -28.6], [3.1, -19], [-3, -19]], 'body'],                   // 战术背心
    ['slate', [[-2.4, -23], [-0.6, -23], [-0.6, -20], [-2.4, -20]], 'body'],                  // 弹匣包
    ['slate', [[0.4, -23], [2.2, -23], [2.2, -20], [0.4, -20]], 'body'],
    ['ink', [[-3.8, -17.2], [3.6, -17.2], [3.6, -16], [-3.8, -16]], 'body'],                  // 腰带
    ['red', [[-0.6, -25.9], [1.5, -26.2], [1.5, -24.4], [-0.6, -24.2]], 'gun'],               // 枪托（抵在肩上）
    ['dusk', [[1.5, -26.6], [7.6, -26.6], [7.6, -24.6], [1.5, -24.4]], 'gun'],                // 机匣
    ['ink', [[5.2, -24.6], [7.2, -24.6], [6.8, -21.6], [5.2, -20.2], [4.4, -21]], 'gun'],     // 弯弹匣
    ['red', [[7.6, -26.4], [11, -26.4], [11, -24.9], [7.6, -24.7]], 'gun'],                   // 护木
    ['slate', [[11, -26], [15.5, -26], [15.5, -25.3], [11, -25.3]], 'gun'],                   // 枪管
    ['ink', [[14.6, -26.8], [15.2, -26.8], [15.2, -26], [14.6, -26]], 'gun'],                 // 准星
    ['orange', [[8.4, -25.2], [10, -25.2], [10, -23.6], [8.4, -23.6]], 'arm'],                // 托护木的手
    ['green', [[1.4, -30], [4.2, -29.4], [4.8, -23.4], [2.6, -23]], 'arm'],                   // 前臂（大臂）
    ['green', [[2.6, -24], [4.8, -23.6], [6.2, -25.2], [4.6, -26]], 'arm'],                   // 前臂（小臂）
    ['orange', [[4.6, -26.2], [6.4, -26.2], [6.4, -24.2], [4.6, -24.2]], 'arm'],              // 扣扳机的手
    ['orange', [[-0.8, -31.4], [1.4, -31.4], [1.4, -30.2], [-0.8, -30.2]], 'neck'],          // 脖子
    ['fog', [[-3.6, -33.4], [-2, -33], [-2.4, -28.6], [-4.4, -29.2]], 'head'],                // 头巾垂下来的尾巴
  ]
  const HEAD = { x: 0.4, y: -34.6, rx: 3.6, ry: 4.4 }
  function tParts(fx, fy, h, face) {
    const u = h / 40
    return {
      u,
      head: { cx: fx + face * HEAD.x * u, cy: fy + HEAD.y * u, rx: Math.max(1.6, HEAD.rx * u), ry: Math.max(2, HEAD.ry * u) },
      torso: { x: R(fx + (face > 0 ? -4.6 : -4) * u), y: R(fy - 30.4 * u), w: Math.max(3, R(8.6 * u)), h: R(14.4 * u) },
      legs: { x: R(fx + (face > 0 ? -3.2 : -4.8) * u), y: R(fy - 16 * u), w: Math.max(2, R(8 * u)), h: R(16 * u) },
      gunY: R(fy - 25.6 * u),
    }
  }
  function rect(x, y, w, h, col) {
    if (w < 0) { x += w; w = -w }
    g.fillStyle = col; g.fillRect(R(x), R(y), Math.max(1, R(w)), Math.max(1, R(h)))
  }
  // pose：stand 站立；crouch 中弹后蹲下（上身下沉、腿压短）；dead 向后倒地
  function drawT(fx, fy, h, face, pose, ox, oy, tint) {
    fx -= ox; fy -= oy
    const u = h / 40
    const map = (x, y) => {
      if (pose === 'crouch') y = y < -16 ? y + 6 : y * 0.62
      if (pose === 'dead') return [fx - face * (-y) * u * 0.95, fy - (x + 5) * u * 0.55]
      return [fx + face * x * u, fy + y * u]
    }
    for (const [col, pts, part] of TPL) {
      if (pose === 'dead' && part === 'gun') continue
      fillPoly(g, pts.map(([x, y]) => map(x, y)), tint || C[col])
    }
    // 头：白头巾，背光一侧灰，脸露出一条，两只眼睛；头巾上一道褶
    const [hx, hy2] = map(HEAD.x, HEAD.y)
    const rx = Math.max(1.6, HEAD.rx * u), ry = Math.max(2, HEAD.ry * u)
    const erx = pose === 'dead' ? ry * 0.6 : rx, ery = pose === 'dead' ? rx * 0.7 : ry
    for (let y = Math.floor(hy2 - ery); y <= Math.ceil(hy2 + ery); y++) for (let x = Math.floor(hx - erx); x <= Math.ceil(hx + erx); x++) {
      const nx = (x + 0.5 - hx) / erx, ny = (y + 0.5 - hy2) / ery
      if (nx * nx + ny * ny > 1) continue
      let c = nx * face < -0.25 ? C.fog : C.white
      if (pose !== 'dead') {
        if (nx * face > -0.1 && ny > -0.2 && ny < 0.3) c = C.orange               // 露出的脸
        else if (Math.abs(ny + 0.55) < 0.12 && u >= 1) c = C.fog                   // 头巾的褶
      }
      g.fillStyle = tint || c; g.fillRect(x, y, 1, 1)
    }
    if (!tint && pose !== 'dead' && u >= 0.7) {
      rect(hx + face * 1.2 * u, hy2 - 0.3 * u, 1, 1, C.ink)
      if (u >= 1.2) rect(hx + face * 2.6 * u, hy2 - 0.3 * u, 1, 1, C.ink)
    }
  }

  // ---------- 架点 ----------
  // door：远处门缝，从左扇门后面往右探；crate：中距离木箱，从箱子左边往左探；pillar：近处石柱，从柱子右边往右探
  const ANGLES = ['door', 'crate', 'pillar']
  function angleGeo(a) {
    const h = EH[a], u = h / 40
    if (a === 'door') return { h, u, face: 1, fy: gy, hide: gap.x - Math.ceil(15 * u) - 1, peek: gap.x + 4.5 * u }
    if (a === 'crate') return { h, u, face: -1, fy: floorMid, hide: crate.x + Math.ceil(15 * u) + 1, peek: crate.x - crateSide - 5 * u }
    return { h, u, face: 1, fy: floorNear, hide: pillar.r + sideW - Math.ceil(15 * u) - 1, peek: pillar.r + sideW + 5 * u }
  }
  const visible = (a, x, y) =>
    a === 'door' ? x >= gap.x && x < gap.r && y >= door.y && y < gy
      : a === 'crate' ? x < crate.x - crateSide
        : x >= pillar.r + sideW
  function markerOf(a) {
    const G = angleGeo(a), fx = G.peek + G.face * 2 * G.u
    const hd = tParts(fx, G.fy, G.h, G.face).head
    return { x: hd.cx, y: hd.cy }
  }
  function enemyFx(rd, p) { const G = angleGeo(rd.angle); return G.hide + (G.peek + G.face * rd.peekD * G.u - G.hide) * p }
  function hitTest(rd, fx, x, y) {
    if (!visible(rd.angle, x, y)) return null
    const G = angleGeo(rd.angle), t = tParts(fx, G.fy, G.h, G.face), hd = t.head
    const nx = (x - hd.cx) / (hd.rx + 0.6), ny = (y - hd.cy) / (hd.ry + 0.6)
    if (nx * nx + ny * ny <= 1) return 'head'
    if (inRect(x, y, { x: t.torso.x - 0.5, y: t.torso.y - 0.5, w: t.torso.w + 1, h: t.torso.h + 1 })) return 'body'
    if (inRect(x, y, { x: t.legs.x - 0.5, y: t.legs.y, w: t.legs.w + 1, h: t.legs.h })) return 'body'
    return null
  }

  // ---------- 状态 ----------
  let state = 'ready'           // ready | play | dying | over
  let phase = 'place'           // place | hold | peek | after
  let rd = null, kills = 0, score = 0, heads = 0, rts = [], stabs = [], log = []   // log：每个击杀的明细，上传排行榜时给机器人重算分数
  let hp = 100, clip = 30, reserve = 90, reloadAt = 0, spread = 0, lastShot = 0, insideSince = 0
  let fx = [], decals = [], feed = [], shells = [], result = null, btnRect = null, muteRect = null, exitRect = null
  let lastAngle = [], dmgAt = 0, sway = { x: 0, y: 0 }, camPrev = { x: 0, y: 0 }

  function newRound(now) {
    const pool = ANGLES.filter(a => !(lastAngle[0] === a && lastAngle[1] === a))   // 同一架点不连着来三次
    const angle = pool[Math.floor(Math.random() * pool.length)]
    lastAngle = [angle, lastAngle[0]]
    rd = { angle, peekD: rand(0, 4), delay: rand(800, 3200), ttk: ttkFor(kills), samples: [], early: false }
    phase = 'place'; insideSince = 0
    if (clip < 6 && reserve > 0 && !reloadAt) startReload(now)
  }
  function start() {
    const now = performance.now()
    state = 'play'
    kills = score = heads = 0; rts = []; stabs = []; log = []
    hp = 100; clip = 30; reserve = 90; reloadAt = 0; spread = 0
    fx = []; decals = []; feed = []; shells = []; lastAngle = []
    newRound(now)
  }
  function startPeek(now, early) {
    phase = 'peek'; rd.peekAt = now; rd.early = early
    if (early) rd.ttk = R(rd.ttk * 0.6)   // 开枪暴露了位置：敌人预瞄着拉出来，更快
    computeStab()
  }
  function computeStab() {
    const s = rd.samples, n = s.length
    if (n < 3) return
    const mx = s.reduce((a, p) => a + p.x, 0) / n, my = s.reduce((a, p) => a + p.y, 0) / n
    const jitter = Math.sqrt(s.reduce((a, p) => a + (p.x - mx) ** 2 + (p.y - my) ** 2, 0) / n)
    const m = markerOf(rd.angle), last = s[n - 1]
    const drift = Math.hypot(last.x - m.x, last.y - m.y)
    rd.stab = R(Math.max(0, Math.min(100, 100 - jitter * 30 - Math.max(0, drift - 3) * 8)))
    stabs.push(rd.stab)
  }
  function killEnemy(now, part, fxPos) {
    const rt = R(now - rd.peekAt)
    rd.result = part; rd.rt = rt; rd.deadAt = now; rd.deadFx = fxPos
    kills++; if (part === 'head') heads++
    rts.push(rt)
    score += 100 + (part === 'head' ? 50 : 0) + R(Math.max(0, (rd.ttk - rt) / rd.ttk) * 100) + R((rd.stab || 0) / 2)
    log.push({ rt, ttk: rd.ttk, head: part === 'head' ? 1 : 0, stab: rd.stab || 0 })
    feed.unshift({ t: now, killer: 'YOU', victim: 'T', hs: part === 'head', mine: true })
    phase = 'after'; rd.afterAt = now
  }
  function die(now, cause) {
    state = 'dying'; rd.dieAt = now; rd.cause = cause
    hp = 0; dmgAt = now
    feed.unshift({ t: now, killer: 'T', victim: 'YOU', hs: Math.random() < 0.5, mine: false })
    audio.noise(0.05, 0.08); audio.noise(0.05, 0.08, 0.09); audio.noise(0.05, 0.08, 0.18)
    audio.note(-22, 0.25, 'triangle', 0.09, 0.05)
    P.unlock()
  }
  function end() {
    state = 'over'
    const best = json(KEY_BEST)
    const isRec = kills > 0 && (!best || kills > (best.kills || 0) || (kills === best.kills && score > best.score))   // 先比击杀，再比分数
    const rank = rankOf(kills)
    if (isRec) store.set(KEY_BEST, JSON.stringify({ score, kills, rank: rank[1], rounds: log, at: Date.now() }))
    result = {
      kills, score, rank, isRec, best, at: performance.now(), cause: rd.cause, ttk: rd.ttk,
      rt: rts.length ? R(rts.reduce((a, b) => a + b, 0) / rts.length) : 0,
      hs: kills ? R(heads / kills * 100) : 0,
      stab: stabs.length ? R(stabs.reduce((a, b) => a + b, 0) / stabs.length) : 0,
    }
    audio.arp([12, 7, 4, 0], 0.09)
  }
  function startReload(now) {
    if (reloadAt || reserve <= 0 || clip >= 30) return
    reloadAt = now
    audio.note(2, 0.04, 'square', 0.03); audio.note(-3, 0.05, 'square', 0.03, 0.9); audio.note(7, 0.04, 'square', 0.04, 1.7)
  }

  // ---------- 输入 ----------
  P.onDown(({ x, y }) => {
    audio.unlock()
    const now = performance.now()
    if (!P.locked && inRect(x, y, exitRect)) { audio.note(0, 0.05); PK.goHome(); return }
    if (state === 'ready' || state === 'over') {
      if (inRect(x, y, muteRect)) { audio.toggle(); return }
      if (inRect(x, y, btnRect) && (state === 'ready' || now - result.at > 500)) { P.lock(); audio.arp([0, 4, 7, 12], 0.045); start() }
      return
    }
    if (state !== 'play') return
    if (P.wantsLock()) { P.lock(); return }   // 中途按 ESC 解锁了：这一下只用来重新锁定，不算开枪
    shoot(now)
  })
  addEventListener('keydown', e => {
    if ((e.key === 'r' || e.key === 'R') && state === 'play') startReload(performance.now())
    // ESC 回主界面。鼠标锁定时第一下 ESC 被浏览器拿去解锁，再按一下才退出
    if (PK.isEsc(e) && !P.locked) { e.preventDefault(); PK.goHome() }
  })

  function shoot(now) {
    if (reloadAt) return
    if (clip <= 0) { audio.note(22, 0.02, 'square', 0.02); startReload(now); return }
    clip--
    lastShot = now
    // 第一枪准，连续开枪散布变大（每枪 +2.2 像素，停手后每秒恢复 12 像素）
    const a = Math.random() * Math.PI * 2, r = Math.random() * spread
    const wx = cam.x + Math.cos(a) * r, wy = cam.y + Math.sin(a) * r
    spread = Math.min(9, spread + 2.2)
    audio.noise(0.09, 0.12); audio.note(-26, 0.08, 'square', 0.06)
    if (!RM) shells.push({ t: now, vx: rand(30, 55), vy: rand(-70, -45) })
    if (clip === 0) setTimeout(() => startReload(performance.now()), 250)

    if (phase === 'hold' || phase === 'place') {               // 敌人还没出来就开枪：暴露位置
      addDecal(wx, wy, now)
      if (phase === 'hold') startPeek(now, true)
      return
    }
    if (phase !== 'peek') { addDecal(wx, wy, now); return }
    const fxPos = enemyFx(rd, peekP(now - rd.peekAt))
    const hit = hitTest(rd, fxPos, wx, wy)
    if (hit) {
      killEnemy(now, hit, fxPos)
      blood(wx, wy, now)
      if (hit === 'head') { audio.note(27, 0.05, 'square', 0.04, 0.03); audio.note(34, 0.15, 'triangle', 0.05, 0.05) }   // 爆头「叮」
      else audio.note(-14, 0.07, 'triangle', 0.08, 0.02)
    } else addDecal(wx, wy, now)
  }
  const peekP = t => Math.min(1, Math.ceil((t / SLIDE) * 3) / 3)

  function addDecal(wx, wy, now) {
    if (wy < far.y - R(H * 0.1) && !(wx < pillar.r + sideW && wx >= pillar.x)) { /* 打到天上 */ }
    else { decals.push({ x: R(wx), y: R(wy) }); if (decals.length > 40) decals.shift() }
    if (RM) return
    for (let i = 0; i < 5; i++) fx.push({ k: 'dust', x: wx, y: wy, vx: rand(-25, 25), vy: rand(-40, -5), t: now })
  }
  function blood(wx, wy, now) {
    if (RM) return
    for (let i = 0; i < 10; i++) fx.push({ k: 'blood', x: wx, y: wy, vx: rand(-45, 45), vy: rand(-55, 10), t: now })
  }

  // ---------- 逐帧逻辑 ----------
  function update(now, dt) {
    spread = Math.max(0, spread - dt * 0.012)
    if (reloadAt && now - reloadAt >= RELOAD) { const n = Math.min(30 - clip, reserve); clip += n; reserve -= n; reloadAt = 0 }
    if (!P.locked && (state === 'play' || state === 'dying')) { cam.x = WC.x + (P.x - W / 2); cam.y = WC.y + (P.y - H / 2); clampCam() }   // 没锁定：光标偏离中心多少，视角就转多少
    if (state === 'ready' || state === 'over') { cam.x = WC.x + (RM ? 0 : Math.sin(now / 2400) * 3); cam.y = WC.y }

    if (state === 'dying' && now - rd.dieAt > 1300) end()
    if (state !== 'play') return
    if (phase === 'place') {
      const m = markerOf(rd.angle)
      if (Math.hypot(cam.x - m.x, cam.y - m.y) <= ZONE) {
        if (!insideSince) insideSince = now
        if (now - insideSince >= 300) { phase = 'hold'; rd.holdAt = now; audio.note(12, 0.03, 'triangle', 0.03) }
      } else insideSince = 0
    } else if (phase === 'hold') {
      rd.samples.push({ x: cam.x, y: cam.y })
      if (now - rd.holdAt >= rd.delay) startPeek(now, false)
    } else if (phase === 'peek') {
      if (now - rd.peekAt >= rd.ttk) die(now, rd.early ? 'early' : 'slow')
    } else if (phase === 'after') {
      if (now - rd.afterAt >= 700) newRound(now)
    }
  }

  // ---------- 绘制：世界 ----------
  function drawEnemyAt(layerAngle, ox, oy, now) {
    if (!rd || rd.angle !== layerAngle || state === 'ready') return
    const G = angleGeo(rd.angle)
    if (rd.deadAt) {
      const age = now - rd.deadAt
      if (age > 700) return
      const pose = age < 60 ? 'stand' : age < 180 ? 'crouch' : 'dead'
      drawT(rd.deadFx, G.fy, G.h, G.face, pose, ox, oy, age < 60 ? C.white : null)
      return
    }
    if (phase !== 'peek' && state !== 'dying') return
    const p = peekP(now - rd.peekAt)
    drawT(enemyFx(rd, p), G.fy, G.h, G.face, 'stand', ox, oy)
    // 打死你的时候：枪口连闪
    if (state === 'dying' && Math.floor((now - rd.dieAt) / 60) % 2 === 0 && now - rd.dieAt < 400) {
      const fx1 = enemyFx(rd, 1), mx = fx1 + G.face * 15.8 * G.u - ox, my = G.fy - 25.8 * G.u - oy
      rect(mx, my - 1, G.face * 2, 3, C.gold); rect(mx + G.face, my, G.face * 2, 1, C.white)
    }
  }
  function drawWorld(now, ox, oy) {
    g.drawImage(layers.bg, -ox, -oy)
    drawEnemyAt('door', ox, oy, now)
    g.drawImage(layers.door, -ox, -oy)
    drawEnemyAt('crate', ox, oy, now)
    g.drawImage(layers.crate, -ox, -oy)
    drawEnemyAt('pillar', ox, oy, now)
    g.drawImage(layers.pillar, -ox, -oy)
    for (const d of decals) { rect(d.x - ox, d.y - oy, 1, 1, C.ink); g.fillStyle = C.plum; g.fillRect(d.x - ox + 1, d.y - oy, 1, 1) }
    // 粒子
    fx = fx.filter(f => now - f.t < 500)
    for (const f of fx) {
      const s = (now - f.t) / 1000
      g.fillStyle = f.k === 'blood' ? (s < 0.2 ? C.red : C.plum) : (s < 0.15 ? C.white : C.fog)
      g.fillRect(R(f.x + f.vx * s - ox), R(f.y + f.vy * s + 140 * s * s - oy), 1, 1)
    }
    // 架点标记（只在「就位」阶段）
    if (state === 'play' && phase === 'place') {
      const m = markerOf(rd.angle), mx = R(m.x - ox), my = R(m.y - oy), inside = insideSince > 0
      if (inside || RM || Math.floor(now / 300) % 2 === 0) {
        ring(mx, my, ZONE + 1, C.ink); ring(mx, my, ZONE, inside ? C.lime : C.white)
      }
      // 标记在屏幕外时，在边缘画个箭头指过去
      if (mx < 4 || mx > W - 4 || my < 4 || my > H - 4) {
        const ax = Math.max(6, Math.min(W - 7, mx)), ay = Math.max(30, Math.min(H - 40, my))
        g.fillStyle = C.white
        g.fillRect(ax - 1, ay - 1, 3, 3)
        g.fillStyle = C.ink; g.fillRect(ax, ay, 1, 1)
      }
    }
  }

  // ---------- 绘制：持枪 ----------
  function drawViewmodel(now) {
    const vx = cam.x - camPrev.x, vy = cam.y - camPrev.y
    sway.x += (Math.max(-5, Math.min(5, -vx * 0.8)) - sway.x) * 0.2
    sway.y += (Math.max(-4, Math.min(4, -vy * 0.8)) - sway.y) * 0.2
    const bob = RM ? 0 : Math.sin(now / 700) * 0.8
    const k = Math.max(0, 1 - (now - lastShot) / 120)                   // 后坐：开枪瞬间往后下方顶，120ms 回位
    const lower = reloadAt ? Math.sin(Math.min(1, (now - reloadAt) / RELOAD) * Math.PI) * 26 * vmS : 0
    const x = R(W - vmGeo.BW * vmS + sway.x + vmGeo.d[0] * k * 3 * vmS)
    const y = R(H - vmGeo.BH * vmS + sway.y + bob + vmGeo.d[1] * k * 3 * vmS + k * vmS + lower)
    g.drawImage(VM, x, y)
    // 枪口火焰
    if (now - lastShot < 45 && !reloadAt) {
      const mx = x + vmGeo.muzzle[0], my = y + vmGeo.muzzle[1], s = Math.max(1, R(vmS))
      g.fillStyle = C.gold
      g.fillRect(R(mx - 4 * s), R(my - 1 * s), 6 * s, 3 * s); g.fillRect(R(mx - 2 * s), R(my - 3 * s), 2 * s, 7 * s)
      g.fillStyle = C.white
      g.fillRect(R(mx - 2 * s), R(my), 3 * s, s)
      g.fillStyle = C.orange
      g.fillRect(R(mx - 6 * s), R(my), 2 * s, s); g.fillRect(R(mx - 1 * s), R(my - 5 * s), s, 2 * s)
    }
    // 抛壳
    shells = shells.filter(sh => now - sh.t < 400)
    for (const sh of shells) {
      const s = (now - sh.t) / 1000
      g.fillStyle = C.gold
      g.fillRect(R(x + vmGeo.port[0] + sh.vx * s), R(y + vmGeo.port[1] + sh.vy * s + 260 * s * s), 2, 1)
    }
  }

  // ---------- 绘制：HUD ----------
  function textShadow(str, x, y, col, s = 1, align = 'left') { btext(str, x + 1, y + 1, C.ink, s, align); btext(str, x, y, col, s, align) }
  function drawRadar(now) {
    const x = 3, y = 3, s = 30
    g.fillStyle = C.dusk; g.fillRect(x, y, s, s)
    g.fillStyle = C.ink; g.fillRect(x + 1, y + 1, s - 2, s - 2)
    g.fillStyle = C.dusk
    g.fillRect(x + 9, y + 4, 12, 24)        // A 大道
    g.fillRect(x + 4, y + 18, 6, 9)         // 石柱那边的岔口
    g.fillStyle = C.navy; g.fillRect(x + 12, y + 3, 6, 2)     // 大门
    g.fillStyle = C.red; g.fillRect(x + 19, y + 13, 3, 3)    // 箱子
    // 自己（白色箭头 + 视野）
    g.fillStyle = C.slate; g.fillRect(x + 13, y + 20, 4, 1); g.fillRect(x + 12, y + 18, 6, 1)
    g.fillStyle = C.white; g.fillRect(x + 15, y + 23, 1, 3); g.fillRect(x + 14, y + 24, 3, 1)
    // 被发现的敌人：红点
    if (rd && state !== 'ready' && (phase === 'peek' || state === 'dying' || (rd.deadAt && now - rd.deadAt < 700))) {
      const pos = { door: [15, 6], crate: [19, 12], pillar: [10, 18] }[rd.angle]
      if (rd.deadAt) { g.fillStyle = C.red; g.fillRect(x + pos[0] - 1, y + pos[1] - 1, 1, 1); g.fillRect(x + pos[0] + 1, y + pos[1] + 1, 1, 1); g.fillRect(x + pos[0] + 1, y + pos[1] - 1, 1, 1); g.fillRect(x + pos[0] - 1, y + pos[1] + 1, 1, 1); g.fillRect(x + pos[0], y + pos[1], 1, 1) }
      else if (Math.floor(now / 150) % 2 === 0 || RM) { g.fillStyle = C.red; g.fillRect(x + pos[0] - 1, y + pos[1] - 1, 3, 3) }
    }
  }
  function drawFeed(now) {
    let y = 16
    feed = feed.filter(f => now - f.t < 5000).slice(0, 3)
    for (const f of feed) {
      const iconW = 10 + (f.hs ? 7 : 0)
      const w = btextW(f.killer) + btextW(f.victim) + iconW + 10
      const x = W - 3 - w
      g.fillStyle = f.mine ? C.red : C.dusk; g.fillRect(x, y, w, 9)
      g.fillStyle = C.ink; g.fillRect(x + 1, y + 1, w - 2, 7)
      let cx = x + 3
      btext(f.killer, cx, y + 2, f.killer === 'YOU' ? C.sky : C.gold); cx += btextW(f.killer) + 2
      // AK 小图标
      g.fillStyle = C.fog; g.fillRect(cx, y + 3, 9, 1); g.fillRect(cx + 3, y + 4, 2, 2); g.fillRect(cx + 6, y + 4, 1, 1)
      g.fillStyle = C.orange; g.fillRect(cx, y + 3, 2, 2)
      cx += 11
      if (f.hs) {   // 爆头图标：脑袋 + 一道
        g.fillStyle = C.white; g.fillRect(cx + 1, y + 2, 3, 4); g.fillRect(cx, y + 3, 5, 2)
        g.fillStyle = C.red; g.fillRect(cx + 4, y + 2, 2, 1)
        cx += 7
      }
      btext(f.victim, cx, y + 2, f.victim === 'YOU' ? C.sky : C.gold)
      y += 11
    }
  }
  function drawHud(now) {
    drawRadar(now)
    // 顶部中间：击杀数 + 敌人反应时间
    const cx = Math.floor(W / 2)
    g.fillStyle = C.navy; g.fillRect(cx - 12, 3, 24, 11)
    g.fillStyle = C.blue; g.fillRect(cx - 12, 3, 24, 1)
    textShadow(kills, cx, 5, C.white, 1, 'center')
    textShadow('KILLS', cx, 16, C.fog, 1, 'center')
    textShadow(`${rd ? rd.ttk : ttkFor(kills)}MS`, cx, 23, C.orange, 1, 'center')
    drawFeed(now)
    // 左下：血量 + 护甲
    const by = H - 11, low = hp < 30
    g.fillStyle = low ? C.red : C.white
    g.fillRect(4, by + 1, 5, 1); g.fillRect(6, by - 1, 1, 5)
    textShadow(hp, 12, by - 2, low ? C.red : C.white, 2)
    g.fillStyle = C.fog; g.fillRect(44, by - 1, 4, 4); g.fillRect(45, by + 3, 2, 1)
    textShadow(100, 51, by - 2, C.fog, 1)
    // 右下：弹药
    const ammoCol = clip === 0 ? C.red : clip < 10 ? C.orange : C.white
    textShadow(`/${reserve}`, W - 4, by + 1, C.fog, 1, 'right')
    textShadow(clip, W - 6 - btextW(`/${reserve}`), by - 2, ammoCol, 2, 'right')
    if (reloadAt) textShadow('RELOADING', W - 4, by - 10, C.orange, 1, 'right')
  }
  function plate(text, col, y) {
    const w = ctext(text, -999, -999, col) + 8   // 先量宽度
    const x = Math.floor((W - w) / 2)
    g.fillStyle = C.ink; g.fillRect(x, y - 2, w, 16)
    ctext(text, Math.floor(W / 2), y, col, { align: 'center' })
  }
  function drawPrompt(now) {
    const y = 56
    if (P.wantsLock()) { if (RM || Math.floor(now / 500) % 2 === 0) plate('点击继续，ESC 退出', C.lime, y); return }
    if (state === 'dying') { plate(rd.cause === 'early' ? '开枪暴露了位置' : '你被击杀了', C.red, y); return }
    if (phase === 'place') plate('准星对准白圈，稳住', C.white, y)
    else if (phase === 'hold' || phase === 'peek') plate('稳住，等他探头', C.fog, y)    // 探头时文字不变，免得成了提示
    else if (phase === 'after') {
      const txt = rd.result === 'head' ? `爆头  ${rd.rt}ms` : `击杀  ${rd.rt}ms`
      plate(txt, rd.result === 'head' ? C.gold : C.lime, y)
    }
  }
  function drawDamage(now) {
    const k = Math.max(0, 1 - (now - dmgAt) / 700)
    if (k <= 0) return
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const e = Math.min(x, y, W - 1 - x, H - 1 - y) / 14
      if (e < 1 && dith(x, y, (1 - e) * k * 0.9)) { g.fillStyle = C.red; g.fillRect(x, y, 1, 1) }
    }
  }

  // ---------- 绘制：开始 / 结算 ----------
  function drawReady() {
    const pw = Math.min(W - 12, 124), ph = 124, cx = Math.floor(W / 2)
    const px = Math.floor((W - pw) / 2), py = Math.max(36, Math.floor((H - ph) / 2) - 10)
    const best = json(KEY_BEST)
    panel(px, py, pw, ph)
    let y = py + 8
    ctext('架枪训练', cx, y, C.gold, { align: 'center', size: 16, shadow: C.red })
    y += 22
    btext('HOLD THE ANGLE · DUST2', cx, y, C.slate, 1, 'center')
    y += 10
    ctext('准星架在点位上稳住', cx, y, C.fog, { align: 'center' })
    y += 15
    ctext('他露头没打死他就输', cx, y, C.fog, { align: 'center' })
    y += 18
    btext(best ? `BEST ${best.kills || 0} KILLS` : '650MS → 300MS', cx, y, C.slate, 1, 'center')
    btnRect = button(px + 5, py + ph - 23, pw - 10, '开始')
  }
  function drawOver(now) {
    const r = result, cx = Math.floor(W / 2)
    const pw = Math.min(W - 12, 124), ph = 176
    const px = Math.floor((W - pw) / 2), py = Math.max(36, Math.floor((H - ph) / 2))
    panel(px, py, pw, ph)
    let y = py + 6
    ctext(r.cause === 'early' ? '开枪暴露了位置' : `被 ${r.ttk}ms 击杀`, cx, y, C.red, { align: 'center' })
    y += 16
    ctext(r.rank[1], cx, y, C.gold, { align: 'center', size: 16, shadow: C.red })
    y += 21
    btext(r.rank[2], cx, y, C.slate, 1, 'center')
    y += 9
    btext(`${r.kills} KILLS`, cx, y, C.white, 2, 'center')
    y += 13
    if (r.isRec) { if (RM || Math.floor(now / 400) % 2 === 0) ctext('新纪录！', cx, y - 1, C.lime, { align: 'center' }) }
    else if (r.best) btext(`BEST ${r.best.kills || 0} · ${r.score}PTS`, cx, y + 3, C.slate, 1, 'center')
    else btext(`${r.score}PTS`, cx, y + 3, C.slate, 1, 'center')
    y += 16
    const cw = Math.floor((pw - 14) / 2)
    const stats = [['平均反应', r.rt ? r.rt + 'MS' : '--'], ['击杀', String(r.kills)], ['爆头率', r.kills ? r.hs + '%' : '--'], ['稳定度', r.stab + '%']]
    stats.forEach(([label, val], i) => {
      const sx = px + 5 + (i % 2) * (cw + 4), sy = y + Math.floor(i / 2) * 32
      g.fillStyle = C.dusk; g.fillRect(sx, sy, cw, 29)
      ctext(label, sx + Math.floor(cw / 2), sy + 2, C.fog, { align: 'center' })
      btext(val, sx + Math.floor(cw / 2), sy + 17, C.white, String(val).length > 5 ? 1 : 2, 'center')
    })
    btnRect = button(px + 5, y + 68, pw - 10, '再来一局')
  }

  let lastFrame = performance.now()
  function frame() {
    const now = performance.now(), dt = Math.min(50, now - lastFrame)
    lastFrame = now
    update(now, dt)
    const ox = R(cam.x - W / 2), oy = R(cam.y - H / 2)
    drawWorld(now, ox, oy)
    drawViewmodel(now)
    camPrev = { x: cam.x, y: cam.y }
    if (state === 'play' || state === 'dying') {
      drawDamage(now)
      PK.crosshair(W / 2, H / 2, R(spread) + (now - lastShot < 80 ? 1 : 0))
      drawHud(now)
      drawPrompt(now)
    } else if (state === 'ready') drawReady()
    else drawOver(now)
    if (state === 'ready' || state === 'over') muteRect = PK.muteButton(W, H)
    exitRect = PK.exitButton(H, { x: 3, y: state === 'play' || state === 'dying' ? 36 : H - 16 })
    if (!P.locked && state !== 'play' && state !== 'dying') PK.crosshair(P.x, P.y)   // 菜单里用普通光标点按钮
    S.present()
    requestAnimationFrame(frame)
  }

  if (DEBUG) window.__hold = () => ({ state, phase, rd, cam: { ...cam }, kills, hp, clip, spread, markerOf, angleGeo, enemyFx, tParts, W, H })
  addEventListener('resize', layout)
  layout()
  P.center()
  requestAnimationFrame(frame)
})()
</script>
</body>
</html>
